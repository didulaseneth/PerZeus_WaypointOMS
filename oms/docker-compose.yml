services:
  mongo: {image: "mongo:7", ports: ["27017:27017"], volumes: ["mongo:/data/db"]}
  backend: {build: ./backend, ports: ["8080:8080"], environment: {MONGO_URI: "mongodb://mongo:27017/waypoint"}, depends_on: [mongo]}
  frontend: {build: ./frontend, ports: ["5173:80"], depends_on: [backend]}
volumes: {mongo: {}}
